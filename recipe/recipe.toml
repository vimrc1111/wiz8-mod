id        = "wiz8"
title     = "Wizardry 8 (Chinese localization + F10 speed menu + live map)"
platform  = "steam"
app_id    = "245450"
build_id  = ""
engine    = "native-x86"
kind      = ["localization", "guide"]
status    = "verified"
contains_translation = true
online_blocked = "none needed: original has no upload"
requires  = []
requires_case = []
runner    = "bash"
build     = "scripts/release.sh"
deploy    = "release/install.bat"
restore   = "release/uninstall.bat (deletes ddraw.dll and Patches/PATCH.002; saves untouched)"

[[requires_external]]
name    = "go"
version = ""
license = "BSD-3"
env     = "PROMODEUS_TOOL_GO"
why     = "build tools"

[[requires_external]]
name    = "mingw-w64"
version = ""
license = "ZPL-2.1/GPL mix"
env     = "PROMODEUS_TOOL_MINGW_W64"
why     = "cross-build the Windows DLL / ScummVM"

[[requires_external]]
name    = "bun"
version = ""
license = "MIT"
env     = "PROMODEUS_TOOL_BUN"
why     = "BitAtlas map adapter"

[[key_file]]
path   = "Wiz8.exe"
sha256 = "18a74ff61c65b8a2d4cfa11ffce82ad7fef022a94eaf0c2f217e479e981420d2"

[[key_file]]
path   = "Data/DATA.SLF"
sha256 = "12ce5055097da6710de995b2465713781190cb00515cd81a0c26fd7732d348cd"

[[key_file]]
path   = "Patches/PATCH.001"
sha256 = "74bbc59acc581ede5e6c148c47486e4f287ea3169deca260abc28d5e9f715936"

[[feature]]
trigger        = "(automatic)"
effect      = "Chinese text rendering via ddraw.dll proxy plus Patches/PATCH.002 generated on the player's machine from the original and translations/"
verified_by = "MG playtest 2026-10-07 and 2026-10-08"

[[feature]]
trigger        = "F10"
effect      = "speed menu: up/down select, left/right change by 25% (10%-5000%), Home resets a row, End resets all, Esc/F10 closes; defaults monster move 400%, event pause 300%, attack animation 200%, party move 100%"
verified_by = "MG playtest 2026-10-12 (menu works); headless run 072352; party-movement effect in game pending MG"

[[feature]]
trigger        = "(external page)"
effect      = "live map page (BitAtlas) fed by the hook writing MAPPOS.JS"
verified_by = "MG 2026-10-31 (map matches in-game view); position dot checked headless/test-double only"

[notes]
limits = "Baseline hashes are the Steam v1.2.4 install (baseline/2026-10-07-steam-clean.json); GOG and other builds unverified. Steam copy was uninstalled 2026-11-01, so CI lanes that read the original are red. release.sh needs Windows' SysWOW64 ddraw.dll (SYS_DDRAW= override); the map deploy (bitatlas/deploy.sh wiz8) needs the shared ../bitatlas outside the case dir. Third-party save editors show garbled text while the patch is installed: run uninstall.bat first."
